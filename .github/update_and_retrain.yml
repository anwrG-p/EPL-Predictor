name: Daily Model Retrain & Update

on:
  schedule:
    # Run at 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Retraining Script
        env:
          DATABASE_URL: "sqlite:///./data/backend.db"
          MODEL_TYPE: "${{ secrets.MODEL_TYPE || 'ensemble' }}"
        run: |
          cd backend
          python scripts/train_manual.py

      - name: Commit and Push Model Artifacts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add backend/models_store/*.pkl || true
          git add backend/data/*.csv || true
          git add backend/reports/shap/*.png || true
          git commit -m "Auto-update: Retrained model and data $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
